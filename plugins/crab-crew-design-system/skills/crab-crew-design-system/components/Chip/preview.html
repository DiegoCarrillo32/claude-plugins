<!doctype html>
<html>
<head><meta charset="utf-8"><title>Chip</title></head>
<body>
<div id="root" class="cc-stage"></div>
<script>
  var C = window.CrabCrew, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', { className: 'cc-hstack' },
    h(C.Chip, null, 'Planned'), h(C.Chip, { tone: 'clawd', dot: true }, 'Working'), h(C.Chip, { tone: 'success', dot: true }, 'Done'),
    h(C.Chip, { tone: 'danger', dot: true }, 'Stopped'), h(C.Chip, { tone: 'warning' }, 'Over budget'), h(C.Chip, { tone: 'info' }, 'Tip')));
</script>
</body>
</html>
