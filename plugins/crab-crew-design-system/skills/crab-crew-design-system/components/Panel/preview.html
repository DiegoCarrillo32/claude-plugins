<!doctype html>
<html>
<head><meta charset="utf-8"><title>Panel</title></head>
<body>
<div id="root" class="cc-stage"></div>
<script>
  var C = window.CrabCrew, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h(C.Panel, { tone: 'clawd', label: 'Flow' },
    h('div', { className: 'cc-hstack', style: { gap: '8px', flexWrap: 'nowrap' } },
      h(C.Crab, { crop: 'body', restyleEyes: false, alt: "Claude's crab", style: { width: 36, height: 22 } }),
      h('div', { style: { minWidth: 0, flex: 1 } },
        h('div', { style: { fontWeight: 700, color: 'var(--clawd-text)' } }, 'Refactor the session store'),
        h(C.Facts, { items: ['Migrating callers', '6m 40s'] })),
      h('strong', null, '3/8')),
    h(C.PixelBar, { done: 3, total: 8, active: 2, working: true }),
    h(C.Facts, { items: ['2 running', '1 planned', '3 done', '~$1.27', '~9m left'] })));
</script>
</body>
</html>
